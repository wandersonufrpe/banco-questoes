# Gera os executáveis de Linux e Windows (o PyInstaller não faz build cruzado) e
# publica numa Release os que passarem no autoteste.
#
# Quando roda:
#   - ao enviar para a main uma mudança na versão (bancoq/__init__.py) ou neste
#     arquivo: cria a tag v<versão> e a Release, se essa versão ainda não existir;
#   - ao enviar uma tag v*: publica a Release dessa tag;
#   - à mão (Actions > Build > Run workflow): só gera os arquivos (Artifacts),
#     a não ser que "publicar" seja marcado.
name: Build

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar uma Release com a versão atual"
        type: boolean
        default: false
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "bancoq/__init__.py"
      - ".github/workflows/build.yml"

jobs:
  linux:
    # Ubuntu 22.04 (glibc 2.35) para o executável rodar também em sistemas um pouco mais antigos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt/QtWebEngine, Xvfb e TeX (para os testes)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libxshmfence1 libgbm1 libasound2 libfuse2 xvfb \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-lang-portuguese \
            texlive-fonts-recommended
      - name: Build (testes, PyInstaller, tar.gz e AppImage)
        run: ./empacotamento/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BancoQuestoes-linux
          path: |
            empacotamento/saida/*.tar.gz
            empacotamento/saida/*.AppImage
      - name: Autoteste do executável
        run: xvfb-run -a ./empacotamento/saida/dist/BancoQuestoes/BancoQuestoes --autoteste

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (testes, PyInstaller e zip)
        shell: cmd
        run: empacotamento\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: BancoQuestoes-windows
          path: empacotamento/saida/*.zip
      - name: Autoteste do executável
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "empacotamento\saida\dist\BancoQuestoes\BancoQuestoes.exe" `
                -ArgumentList "--autoteste", "--relatorio", "autoteste.txt" -Wait -PassThru
          Get-Content autoteste.txt
          if ($p.ExitCode -ne 0) { exit 1 }

  release:
    # Publica na página de Releases os executáveis que passaram no autoteste
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.publicar) }}
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Versão e tag
        id: versao
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            publicar=true
          else
            v=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('bancoq/__init__.py').read()).group(1))")
            tag="v$v"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "A versão $tag já foi publicada; mude __version__ para publicar outra."
              publicar=false
            else
              publicar=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
      - if: steps.versao.outputs.publicar == 'true' && needs.linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: BancoQuestoes-linux
          path: arquivos
      - if: steps.versao.outputs.publicar == 'true' && needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: BancoQuestoes-windows
          path: arquivos
      - if: steps.versao.outputs.publicar == 'true' && (needs.linux.result == 'success' || needs.windows.result == 'success')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Banco de Questões ${{ steps.versao.outputs.tag }}
          files: arquivos/*
          fail_on_unmatched_files: false
          body: |
            Executáveis do Banco de Questões (não é preciso instalar Python).

            - **Linux:** baixe o `.AppImage`, dê permissão de execução (`chmod +x`) e abra; ou extraia o `.tar.gz` e rode `BancoQuestoes/BancoQuestoes`.
            - **Windows:** extraia o `.zip` e abra `BancoQuestoes\BancoQuestoes.exe`.

            Para a prévia exata e o PDF, instale o TeX (veja a seção 2 do README).
